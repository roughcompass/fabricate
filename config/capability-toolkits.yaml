# The capability toolkits a Portal can install in its experience editor
# (docs/experience-editor.md, "Catalogs"). Installing one adds its runtime
# module to the portal's bootstrap and enables the frame zone or slot it
# serves.
#   serves     a frame slot (zone.slot) or an overlay (overlay.<id>)
#   checks     prerequisites the editor can check: searchable-sources, menu-items
toolkits:
  - id: global-search
    name: Global Search
    description: Typeahead search across configured data sources.
    adds: Adds the global typeahead search box to the header. Operators configure its placeholder, keyboard shortcut, width, and the ordered list of searchable data sources.
    module: "@deweb/global-search"
    serves: header.global-search
    installed: false
    prerequisites:
      - text: At least one searchable data source available in the portal.
        check: searchable-sources
        required: true
      - text: Search service entitlement granted to the portal (auto-checked).
        required: false
      - text: "Recommended: a keyboard shortcut that does not collide with existing portal shortcuts."
        required: false
  - id: notifications
    name: Notifications
    description: A header bell with the user's unread notifications.
    adds: Adds a notifications control to the header, with an unread count and a panel listing recent notifications.
    module: "@deweb/notifications"
    serves: header.notifications
    installed: false
    prerequisites:
      - text: Notification service entitlement granted to the portal (auto-checked).
        required: false
  - id: system-messages
    name: System Messages
    description: Scheduled maintenance and environment banners.
    adds: Shows the first active system message in the Banner Zone, with schedules, severities, and dismissal.
    module: "@deweb/system-messages"
    serves: banner.message
    installed: true
    prerequisites: []
  - id: menu-management
    name: Menu Management
    description: The portal's left or flyout menu, edited in the full-page menu editor.
    adds: Renders the Portal's menu in the Sidebar Zone's Main Slot, or as a flyout from the header's toggle.
    module: "@deweb/menu"
    serves: sidebar.main
    installed: true
    prerequisites: []
  - id: session-management
    name: Session Management
    description: Inactivity, duplicate session, and system error dialogs.
    adds: Shows the Session Overlay's dialogs with the portal's session language and policy.
    module: "@deweb/session"
    serves: overlay.session
    installed: true
    prerequisites: []
