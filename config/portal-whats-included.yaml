# What a Portal gives its team, shown beside the Create Portal form
# (docs/onboarding.md, "What's included").
#
# Items appear in this order. Each has a title and a description, both
# 120 characters or fewer. `badge: new` adds a "New" tag. `platforms` limits
# an item to those platforms (web, mobile, desktop); leave it out to show the
# item for every platform. An optional `link` with a `label` and an https
# `href` ends the list and opens in a new tab.
#
# In development a change appears on the next page load; in production, after
# the next deploy or restart. `npm test` fails if the file doesn't match this
# shape.
title: What's included
items:
  - title: Menus up to five levels deep
    description: Group the routes the way your users navigate, and change them at any time
  - title: A default route
    description: The Portal opens on the menu item you choose
  - title: Your Applications in one place
    description: Every Application registered in the Portal, ready to add to its menu
  - title: Prototype to Production
    description: Promote the Portal once its menu is ready, and return it whenever you need to
  - title: Change history
    description: Every edit and promotion is kept with who stated they made it
  - title: Rendering from assessment
    description: DE Web determines how each Application renders from its repository
    badge: new
